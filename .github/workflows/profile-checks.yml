name: Profile Checks

on:
  pull_request:
    paths:
      - "scripts/update_recent_projects.py"
      - "scripts/test_recent_projects.py"
      - ".github/workflows/profile-checks.yml"
  push:
    branches: [main]
    paths:
      - "scripts/update_recent_projects.py"
      - "scripts/test_recent_projects.py"
      - ".github/workflows/profile-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
